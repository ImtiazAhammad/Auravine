<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Order and service tracking board">
  <rect width="1600" height="1000" fill="#18181b"/>
  <text x="110" y="120" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#fafaf9">Order and service tracking</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="110" y="170" width="350" height="700" rx="24" fill="#27272a"/><text x="140" y="220" font-size="28" font-weight="700" fill="#fafaf9">Service received</text>
    <rect x="130" y="250" width="310" height="110" rx="16" fill="#3f3f46"/><text x="150" y="300" font-size="22" fill="#e4e4e7">#1049 · Battery swap</text>
    <rect x="130" y="380" width="310" height="110" rx="16" fill="#3f3f46"/><text x="150" y="430" font-size="22" fill="#e4e4e7">#1050 · Charging port</text>
    <rect x="625" y="170" width="350" height="700" rx="24" fill="#27272a"/><text x="655" y="220" font-size="28" font-weight="700" fill="#fafaf9">Repairing</text>
    <rect x="645" y="250" width="310" height="110" rx="16" fill="#3f3f46"/><text x="665" y="300" font-size="22" fill="#e4e4e7">#1048 · Screen</text>
    <rect x="1140" y="170" width="350" height="700" rx="24" fill="#27272a"/><text x="1170" y="220" font-size="28" font-weight="700" fill="#fafaf9">Ready for pickup</text>
    <rect x="1160" y="250" width="310" height="110" rx="16" fill="#3f3f46"/><text x="1180" y="300" font-size="22" fill="#e4e4e7">#1044 · Speaker</text>
  </g>
  <text x="800" y="960" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#71717a">Sample visual · illustrative only</text>
</svg>
