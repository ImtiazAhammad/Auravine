<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="The Handset Depot store showing pre-owned and new phones, accessories and servicing">
  <defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18181b"/><stop offset="1" stop-color="#3f2a1d"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="url(#hd)"/>
  <text x="110" y="150" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#fafaf9">The Handset Depot</text>
  <text x="110" y="200" font-family="Inter, Arial, sans-serif" font-size="26" fill="#d6d3d1">Pre-owned · New · Accessories · Servicing</text>
  <!-- product cards -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="110" y="260" width="330" height="420" rx="28" fill="#27272a"/>
    <rect x="160" y="310" width="230" height="330" rx="34" fill="#52525b"/><rect x="180" y="340" width="190" height="270" rx="16" fill="#a1a1aa"/>
    <text x="140" y="630" font-size="26" font-weight="700" fill="#fafaf9">Certified pre-owned</text>
    <rect x="480" y="260" width="330" height="420" rx="28" fill="#27272a"/>
    <rect x="530" y="310" width="230" height="330" rx="34" fill="#52525b"/><rect x="550" y="340" width="190" height="270" rx="16" fill="#d4d4d8"/>
    <text x="510" y="630" font-size="26" font-weight="700" fill="#fafaf9">New handsets</text>
    <rect x="850" y="260" width="330" height="420" rx="28" fill="#27272a"/>
    <ellipse cx="1015" cy="450" rx="120" ry="60" fill="#71717a"/><circle cx="960" cy="520" r="36" fill="#a1a1aa"/><circle cx="1070" cy="520" r="36" fill="#a1a1aa"/>
    <text x="880" y="630" font-size="26" font-weight="700" fill="#fafaf9">Earbuds and neckbands</text>
    <rect x="1220" y="260" width="270" height="420" rx="28" fill="#27272a"/>
    <rect x="1290" y="330" width="130" height="260" rx="22" fill="#d97706"/><rect x="1320" y="300" width="70" height="30" rx="8" fill="#a1a1aa"/>
    <text x="1250" y="630" font-size="26" font-weight="700" fill="#fafaf9">Cases and chargers</text>
  </g>
  <!-- service ticket -->
  <rect x="110" y="740" width="1380" height="170" rx="28" fill="#fafaf9"/>
  <text x="150" y="800" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#18181b">Service ticket #1048 · Screen replacement</text>
  <text x="150" y="850" font-family="Inter, Arial, sans-serif" font-size="24" fill="#57534e">Received → Diagnosing → Repairing → Ready for pickup</text>
  <text x="1490" y="980" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" fill="#a8a29e">Sample visual · illustrative only</text>
</svg>
