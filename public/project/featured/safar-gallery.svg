<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Safar fleet of 25 electric shuttles">
  <rect width="1600" height="1000" fill="#0c1a14"/>
  <text x="800" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#ecfdf5">25 electric shuttles, fixed routes, shared rides</text>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="300" width="330" height="200" rx="28" fill="#17392b"/><text x="285" y="390" font-size="36" font-weight="700" fill="#facc15">Fixed routes</text><text x="285" y="438" font-size="24" fill="#94a3b8">Stops across Dhaka</text>
    <rect x="500" y="300" width="330" height="200" rx="28" fill="#17392b"/><text x="665" y="390" font-size="36" font-weight="700" fill="#facc15">Live tracking</text><text x="665" y="438" font-size="24" fill="#94a3b8">See the shuttle coming</text>
    <rect x="880" y="300" width="330" height="200" rx="28" fill="#17392b"/><text x="1045" y="390" font-size="36" font-weight="700" fill="#facc15">Commuters only</text><text x="1045" y="438" font-size="24" fill="#94a3b8">Shared with riders</text>
    <rect x="1260" y="300" width="220" height="200" rx="28" fill="#17392b"/><text x="1370" y="390" font-size="36" font-weight="700" fill="#facc15">Electric</text><text x="1370" y="438" font-size="24" fill="#94a3b8">Quieter streets</text>
  </g>
  <text x="800" y="700" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#64748b">Sample visual · illustrative only</text>
</svg>
