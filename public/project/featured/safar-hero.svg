<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Safar shuttle app showing live shuttle locations on a Dhaka route">
  <rect width="1600" height="1000" fill="#0c1a14"/>
  <!-- map grid -->
  <g stroke="#1e3b2f" stroke-width="3">
    <line x1="0" y1="180" x2="1100" y2="180"/><line x1="0" y1="380" x2="1100" y2="380"/><line x1="0" y1="600" x2="1100" y2="600"/><line x1="0" y1="820" x2="1100" y2="820"/>
    <line x1="200" y1="0" x2="200" y2="1000"/><line x1="450" y1="0" x2="450" y2="1000"/><line x1="700" y1="0" x2="700" y2="1000"/><line x1="950" y1="0" x2="950" y2="1000"/>
  </g>
  <rect x="0" y="0" width="1100" height="1000" fill="none"/>
  <!-- route -->
  <path d="M120 700 C 300 640, 380 470, 560 430 S 820 300, 1000 240" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-dasharray="1 0"/>
  <path d="M120 700 C 300 640, 380 470, 560 430 S 820 300, 1000 240" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-dasharray="18 22" stroke-linecap="round"/>
  <!-- stops -->
  <g fill="#0c1a14" stroke="#34d399" stroke-width="6">
    <circle cx="120" cy="700" r="20"/><circle cx="560" cy="430" r="20"/><circle cx="1000" cy="240" r="20"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#ecfdf5">
    <text x="90" y="770">Jashimuddin</text>
    <text x="520" y="492">Mirpur Road</text>
    <text x="1000" y="196" text-anchor="middle">Uttara North Metro</text>
  </g>
  <!-- shuttles -->
  <g>
    <rect x="360" y="300" width="130" height="64" rx="16" fill="#facc15"/>
    <text x="425" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0c1a14">Shuttle 07</text>
    <rect x="760" y="300" width="130" height="64" rx="16" fill="#facc15"/>
    <text x="825" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0c1a14">Shuttle 12</text>
    <rect x="260" y="610" width="130" height="64" rx="16" fill="#facc15"/>
    <text x="325" y="650" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0c1a14">Shuttle 03</text>
  </g>
  <!-- side panel -->
  <rect x="1140" y="60" width="400" height="880" rx="36" fill="#11261d" stroke="#1e3b2f" stroke-width="2"/>
  <text x="1180" y="130" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#ecfdf5">Safar</text>
  <text x="1180" y="168" font-family="Inter, Arial, sans-serif" font-size="20" fill="#86efac">Electric neighborhood shuttle</text>
  <rect x="1180" y="200" width="320" height="130" rx="20" fill="#17392b"/>
  <text x="1210" y="244" font-family="Inter, Arial, sans-serif" font-size="22" fill="#86efac">Next shuttle</text>
  <text x="1210" y="290" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#ecfdf5">4 min away</text>
  <text x="1210" y="314" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">Shuttle 07 · 12 seats free</text>
  <text x="1180" y="390" font-family="Inter, Arial, sans-serif" font-size="22" fill="#94a3b8">Your route</text>
  <text x="1180" y="430" font-family="Inter, Arial, sans-serif" font-size="26" fill="#ecfdf5">Jashimuddin → Uttara</text>
  <text x="1180" y="466" font-family="Inter, Arial, sans-serif" font-size="26" fill="#ecfdf5">North Metro Station</text>
  <rect x="1180" y="510" width="320" height="66" rx="33" fill="#34d399"/>
  <text x="1340" y="551" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#052e1f">Book a seat</text>
  <text x="1180" y="650" font-family="Inter, Arial, sans-serif" font-size="22" fill="#94a3b8">Fleet</text>
  <text x="1180" y="700" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#facc15">25</text>
  <text x="1180" y="740" font-family="Inter, Arial, sans-serif" font-size="22" fill="#ecfdf5">electric shuttles on the road</text>
  <text x="1180" y="860" font-family="Inter, Arial, sans-serif" font-size="20" fill="#64748b">Sample visual · illustrative only</text>
</svg>
