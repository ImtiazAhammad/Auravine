name: keep-alive

# Supabase pauses free projects after about a week without activity. One read every three days
# keeps it awake. GitHub also switches off scheduled workflows after 60 days with no commits in
# a public repo: if that happens, push any commit or re-enable this workflow under Actions.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row through the public API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are not set"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/site_settings?select=key&limit=1")
          echo "Supabase answered HTTP $status"
          [ "$status" = "200" ]
